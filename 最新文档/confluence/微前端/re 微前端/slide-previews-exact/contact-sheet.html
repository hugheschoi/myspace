<!doctype html>

    <title>Micro Frontend Architecture Slide QA Contact Sheet</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f4f2ec;
        color: #1f2933;
        font-family: Arial, "PingFang SC", sans-serif;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 22px;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }

      figure {
        margin: 0;
        padding: 10px;
        background: #fff;
        border: 1px solid #d9d3c7;
        border-radius: 6px;
        box-shadow: 0 6px 14px rgba(32, 44, 55, 0.08);
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border: 1px solid #ebe7dd;
      }

      figcaption {
        margin-top: 7px;
        font-size: 12px;
        font-weight: 700;
        color: #53616d;
      }
    </style>
  </head>
